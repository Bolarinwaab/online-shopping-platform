<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopCloud</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f6f7fb;color:#172033}main{max-width:980px;margin:auto;padding:56px 24px}h1{font-size:48px;margin:0 0 12px}p{font-size:18px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #00000012}button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><main><h1>ShopCloud</h1><p>Discover products, shop securely and track every order.</p><div class="grid"><div class="card"><h3>Product discovery</h3><p>Search, filter and review products.</p><button onclick="alert('Demo product added to cart')">Add demo item</button></div><div class="card"><h3>Secure checkout</h3><p>Cart, checkout and payment adapter boundary.</p></div><div class="card"><h3>Order tracking</h3><p>Follow order and fulfilment status.</p></div></div></main></body></html>
